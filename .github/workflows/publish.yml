# Stages a new npm version when a GitHub Release is published. npm trusted publishing (OIDC)
# authenticates the job, so no npm token is stored. A maintainer then approves the staged
# version with 2FA on npmjs.com (or `npm stage approve`) before it is public.
#
# The package supports Node 20 and later, but the toolchain needs Node 22.12. So the bundles
# are built and fully tested on Node 24, smoke-tested on Node 20, and that same build is what
# gets published.
#
# Actions are pinned to commit SHAs, the same ones as node.js.yml: this workflow can
# request a publish token, so a moved tag must not change what it runs.

name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24.x
        cache: 'npm'
    - name: Check the release tag matches package.json
      env:
        TAG: ${{ github.event.release.tag_name }}
      run: test "v$(node -p "require('./package.json').version")" = "$TAG"
    # The npm that writes package-lock.json (see node.js.yml), whatever Node 24 bundles
    - run: npm install -g npm@11
    # TypeScript 7's compiler is a per-platform optional dependency, so never --omit=optional
    - run: npm ci
    - run: npm run lint
    - run: npm run build
    - run: npm test
    - run: npm run test:smoke
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: dist
        path: dist/
        if-no-files-found: error

  smoke:
    needs: build
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ matrix.node-version }}
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: dist
        path: dist/
    # No npm ci: the smoke tests use only node:test and the built bundles.
    - run: npm run test:smoke

  publish:
    needs: [build, smoke]
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write   # lets npm exchange a GitHub OIDC token for a short-lived publish token

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24.x
        registry-url: https://registry.npmjs.org
    - run: npm install -g npm@latest   # trusted publishing and staged publishing need a recent npm
    # The bundles built and tested above. The package has no build or prepublish
    # scripts, so nothing rebuilds them before packing.
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: dist
        path: dist/
    - run: npm stage publish
